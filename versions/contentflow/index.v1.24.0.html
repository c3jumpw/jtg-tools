              return '<button type="button" class="wizard-option' + (state.ideaDraftSourceType === t ? ' active' : '') + '" style="flex:1" data-action="set-idea-type" data-value="' + t + '">' + esc(SOURCE_TYPE_LABELS[t]) + '</button>';
            }).join('') +
          '</div>' +
          '<input id="idea-title-input" type="text" placeholder="' + (typeIsLink ? 'What\'s this link about?' : 'What\'s the idea?') + '" value="' + esc(state.ideaDraftTitle) + '" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;margin-bottom:8px" />' +
          (typeIsLink ? '<input id="idea-url-input" type="url" placeholder="https://…" value="' + esc(state.ideaDraftSourceUrl) + '" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;margin-bottom:8px" />' : '') +
          '<textarea id="idea-body-input" placeholder="Any more detail? (optional)" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;min-height:60px;margin-bottom:8px">' + esc(state.ideaDraftBody) + '</textarea>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">' +
            '<select id="idea-pillar-select" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:13px">' + pillarOptions + '</select>' +
            '<input id="idea-category-input" type="text" placeholder="Category (optional)" value="' + esc(state.ideaDraftCategory) + '" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:13px;width:160px" />' +
            '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="idea-private-checkbox"' + (state.ideaDraftIsPrivate ? ' checked' : '') + ' /> Private to me</label>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
            '<button class="btn btn-primary btn-sm" type="submit">Save</button>' +
            '<button class="btn btn-outline btn-sm" type="button" data-action="cancel-new-idea">Cancel</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    ) : '';

    var visibleIdeas = filteredIdeasForView();
    var health = pipelineHealthText();
    var isMatrixView = state.ideaFilter === 'active' || state.ideaFilter === 'needs_review';

    var body;
    if (isMatrixView) {
      // Pillars as columns (like the production board), plus an
      // always-present "Unsorted" catch-all -- drag a card between columns
      // to re-tag it. This is the "matching game" layout: sorting an idea
      // is a drag, not a form.
      var columns = state.pillars.map(function (p) { return { id: p.id, name: p.name }; });
      columns.push({ id: null, name: 'Unsorted' });
      var grouped = {};
      visibleIdeas.forEach(function (idea) {
        var key = idea.pillar_id || '__none__';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(idea);
      });
      body = '<div class="board pillar-board">' + columns.map(function (col) {
        var key = col.id || '__none__';
        var ideasInCol = grouped[key] || [];
        return (
          '<div class="board-column pillar-column" data-pillar-id="' + esc(col.id || '') + '">' +
            '<div class="board-column-header">' + esc(col.name) + ' <span class="count">' + ideasInCol.length + '</span></div>' +
            '<div class="board-column-body">' +
              (ideasInCol.length === 0
                ? '<div class="empty-state" style="padding:24px 10px;font-size:12px">Drag an idea here</div>'
                : ideasInCol.map(function (idea) {
                    return (
                      '<div class="card idea-card" draggable="true" data-idea-id="' + idea.id + '" data-action="open-idea-detail" data-id="' + idea.id + '">' +
                        ideaCardBadges(idea) +
                        '<div class="card-title">' + esc(idea.title) + '</div>' +
                        (idea.source_type === 'link' && idea.source_url ? '<div class="idea-row-body">' + esc(idea.source_url) + '</div>' : '') +
                        (idea.body ? '<div class="idea-row-body">' + esc(idea.body) + '</div>' : '') +
                        '<div class="idea-row-actions" style="margin-top:8px">' +
                          '<button type="button" class="btn btn-outline btn-sm" data-action="convert-idea" data-id="' + idea.id + '">Promote</button>' +
                          '<button type="button" class="icon-btn" data-action="archive-idea" data-id="' + idea.id + '" title="Archive">✕</button>' +
                        '</div>' +
                      '</div>'
                    );
                  }).join('')) +
            '</div>' +
          '</div>'
        );
      }).join('') + '</div>';
    } else {
      // Archived / Promoted: a flat sorted list -- these aren't "to be
      // sorted" anymore, so the pillar matrix doesn't apply.
      body = visibleIdeas.length === 0
        ? '<div class="empty-state">Nothing here yet.</div>'
        : visibleIdeas.map(function (idea) {
            return (
              '<div class="idea-row" data-action="open-idea-detail" data-id="' + idea.id + '" style="cursor:pointer">' +
                '<div class="idea-row-main">' +
                  ideaCardBadges(idea) +
                  '<div class="idea-row-title">' + esc(idea.title) + '</div>' +
                  (idea.body ? '<div class="idea-row-body">' + esc(idea.body) + '</div>' : '') +
                '</div>' +
                '<div class="idea-row-actions">' +
                  (state.ideaFilter === 'archived' ? '<button type="button" class="btn btn-outline btn-sm" data-action="unarchive-idea" data-id="' + idea.id + '">Restore</button>' : '<span class="text-faint" style="font-size:12px">Promoted</span>') +
                '</div>' +
              '</div>'
            );
          }).join('');
    }

    var filterTabs = [
      { key: 'active', label: 'Active', color: 'var(--accent)' },
      { key: 'needs_review', label: 'Needs Review', color: '#a8710f' },
      { key: 'archived', label: 'Archived', color: 'var(--text-faint)' },
      { key: 'promoted', label: 'Promoted', color: '#2F9E44' },
    ].map(function (f) {
      return (
        '<button type="button" class="view-tab' + (state.ideaFilter === f.key ? ' active' : '') + '" style="padding:6px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px" data-action="set-idea-filter" data-value="' + f.key + '">' +
          '<span class="status-dot" style="background:' + f.color + '"></span>' + f.label +
        '</button>'
      );
    }).join('');

    return (
      '<div class="ideas-inbox">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px">' +
          '<h2 style="font-family:var(--font-display);font-size:18px">Idea Inbox</h2>' +
          (!state.ideaCapturing ? '<button type="button" class="btn btn-primary btn-sm" data-action="start-new-idea">+ Capture</button>' : '') +
        '</div>' +
        '<p class="connect-help" style="margin:0 0 14px">Raw material, not yet real work -- nothing here shows up on the production board until you hit "Promote." Drag a card between pillars to re-sort it.</p>' +
        (health ? '<div class="status-banner" style="margin-bottom:14px">' + esc(health) + '</div>' : '') +
        (state.ideasError ? '<div class="status-banner error">' + esc(state.ideasError) + '</div>' : '') +
        captureForm +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">' +
          '<div class="view-tabs" style="background:var(--paper-dim)">' + filterTabs + '</div>' +
          '<button type="button" class="btn btn-outline btn-sm" data-action="toggle-idea-sort">Sort: ' + (state.ideaSort === 'oldest' ? 'Oldest first' : 'Newest first') + '</button>' +
        '</div>' +
        body +
      '</div>'
    );
  }

  /** Renders the shared, account-wide message thread -- newest first, reusing formatLogTimestamp for a consistent look with the per-task Log. */
  function accountMessageHubHtml(accountId) {
    var messagesHtml = state.accountMessagesLoading
      ? '<span class="muted" style="font-size:12.5px">Loading…</span>'
      : (state.accountMessages.length === 0
          ? '<span class="muted" style="font-size:12.5px">No messages yet -- this is a shared space for updates and questions about this account.</span>'
          : state.accountMessages.map(function (m) {
              return (
                '<div class="comment">' +
                  '<span class="avatar" style="background:' + colorForString(m.creator_label || 'U') + ';margin-left:0">' + esc(initials(m.creator_label || 'U')) + '</span>' +
                  '<div class="comment-body">' +
                    '<div class="comment-author">' + esc(m.creator_label || 'Someone') + ' <span class="comment-time">' + esc(formatLogTimestamp(new Date(m.created_at).getTime())) + '</span></div>' +
                    '<div>' + esc(m.body) + '</div>' +
                  '</div>' +
                '</div>'
              );
            }).join('')
        );
    return (
      '<h3>Messages <span class="text-faint" style="font-weight:400;font-size:12px">(shared across everyone with access to this account)</span></h3>' +
      '<div class="file-category" style="margin-bottom:20px">' +
        (state.accountMessagesError ? '<div class="status-banner error" style="margin-bottom:8px">' + esc(state.accountMessagesError) + '</div>' : '') +
        '<div style="margin-bottom:10px">' + messagesHtml + '</div>' +
        '<form class="comment-form" id="account-message-form" data-account-id="' + esc(accountId) + '">' +
          '<textarea id="account-message-input" placeholder="Post an update or question…">' + esc(state.newAccountMessageText) + '</textarea>' +
          '<button class="btn btn-outline btn-sm" type="submit" ' + (state.postingAccountMessage ? 'disabled' : '') + '>' + (state.postingAccountMessage ? 'Posting…' : 'Post') + '</button>' +
        '</form>' +
      '</div>'
    );
  }

  /** Shared Feed body -- openAction is 'open-task' (admin/rep) or 'client-open-task' (client), since clicking a feed item opens that entry the same way clicking its card would. */
  function feedBodyHtml(openAction, totalTaskCount) {
    if (state.feedLoading) return '<div class="center-loading"><div class="spinner"></div>Loading activity…</div>';
    if (state.feedError) return '<div class="status-banner error">' + esc(state.feedError) + '</div>';
    if (state.feedItems.length === 0) return '<div class="empty-state"><h3>No activity yet</h3><p>Comments logged on entries will show up here as they happen.</p></div>';

    var rows = state.feedItems.map(function (item) {
      var c = item.comment;
      var uname = (c.user && c.user.username) || 'U';
      var text = c.comment_text || (c.comment && c.comment.map(function (p) { return p.text; }).join('')) || '';
      return (
        '<div class="comment" data-action="' + openAction + '" data-task-id="' + esc(item.taskId) + '" style="cursor:pointer">' +
          '<span class="avatar" style="background:' + colorForString(uname) + ';margin-left:0">' + esc(initials(uname)) + '</span>' +
          '<div class="comment-body">' +
            '<div class="comment-author">' + esc(uname) + ' on <strong>' + esc(item.taskName) + '</strong>' +
              (item.accountId ? ' <span class="account-badge" style="margin:0 0 0 4px">' + esc(accountDisplayName(item.accountId)) + '</span>' : '') +
              ' <span class="comment-time">' + esc(formatLogTimestamp(c.date)) + '</span>' +
            '</div>' +
            '<div>' + esc(text) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    var cappedNote = totalTaskCount > FEED_TASK_CAP
      ? '<p class="connect-help" style="margin-top:14px">Showing activity from the ' + FEED_TASK_CAP + ' most recently updated entries out of ' + totalTaskCount + '.</p>'
      : '';
    return '<div class="feed-list">' + rows + '</div>' + cappedNote;
  }

  function feedHtml() {
    if (state.feedLoadedForKey !== state.accountFilter) loadFeed();
    return feedBodyHtml('open-task', filteredTasks().length);
  }

  function clientFeedHtml() {
    var key = 'client:' + (state.accountFilter || 'all');
    if (state.feedLoadedForKey !== key) loadClientFeed();
    return feedBodyHtml('client-open-task', filteredClientTasks().length);
  }

  function dashboardBodyHtml(tasks, openAction) {
    var statuses = statusBreakdown(tasks);
    var accounts = accountBreakdown(tasks);
    var attention = needsAttention(tasks);
    var stuck = stuckTasks(tasks);
    var overdueCount = attention.filter(function (a) { return a.overdue; }).length;
    var maxStatusCount = Math.max.apply(null, [1].concat(statuses.map(function (s) { return s.count; })));

    var statCards = (
      '<div class="dash-stat"><div class="dash-stat-value">' + tasks.length + '</div><div class="dash-stat-label">Total tasks</div></div>' +
      '<div class="dash-stat' + (overdueCount ? ' dash-stat-danger' : '') + '"><div class="dash-stat-value">' + overdueCount + '</div><div class="dash-stat-label">Overdue</div></div>' +
      '<div class="dash-stat"><div class="dash-stat-value">' + (attention.length - overdueCount) + '</div><div class="dash-stat-label">Due this week</div></div>' +
      '<div class="dash-stat' + (stuck.length ? ' dash-stat-warning' : '') + '"><div class="dash-stat-value">' + stuck.length + '</div><div class="dash-stat-label">Stuck</div></div>' +
      (accounts.length > 1 ? '<div class="dash-stat"><div class="dash-stat-value">' + accounts.length + '</div><div class="dash-stat-label">Accounts</div></div>' : '')
    );

    var statusRows = statuses.map(function (s) {
      var pct = Math.round((s.count / maxStatusCount) * 100);
      return (
        '<div class="dash-bar-row">' +
          '<div class="dash-bar-label"><span class="status-dot" style="background:' + esc(hexColor(s.color)) + '"></span>' + esc(s.name) + '</div>' +
          '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%;background:' + esc(hexColor(s.color)) + '"></div></div>' +
          '<div class="dash-bar-count">' + s.count + '</div>' +
        '</div>'
      );
    }).join('');

    var accountRows = accounts.length > 1 ? (
      '<h3>By account</h3><div class="dash-bars">' +
        accounts.map(function (a) {
          var pct = Math.round((a.count / accounts[0].count) * 100);
          return (
            '<div class="dash-bar-row">' +
              '<div class="dash-bar-label">' + esc(a.name) + '</div>' +
              '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="dash-bar-count">' + a.count + '</div>' +
            '</div>'
          );
        }).join('') +
      '</div>'
    ) : '';

    var attentionRows = attention.length === 0
      ? '<div class="empty-state">Nothing overdue or due this week.</div>'
      : '<div class="dash-attention-list">' + attention.map(function (a) {
          return (
            '<div class="dash-attention-row' + (a.overdue ? ' overdue' : '') + '" data-action="' + openAction + '" data-task-id="' + esc(a.task.id) + '">' +
              '<span class="dash-attention-date">' + esc(formatDisplayDate(a.dateStr)) + (a.overdue ? ' (overdue)' : '') + '</span>' +
              '<span class="dash-attention-name">' + esc(a.task.name) + '</span>' +
            '</div>'
          );
        }).join('') + '</div>';

    var stuckRows = stuck.length === 0
      ? '<div class="empty-state">Nothing stalled -- every open task has a next step or recent activity.</div>'
      : '<div class="dash-attention-list">' + stuck.map(function (s) {
          return (
            '<div class="dash-attention-row stuck" data-action="' + openAction + '" data-task-id="' + esc(s.task.id) + '">' +
              '<span class="dash-attention-date">' + s.daysSinceUpdate + 'd quiet</span>' +
              '<span class="dash-attention-name">' + esc(s.task.name) + '</span>' +
            '</div>'
          );
        }).join('') + '</div>';

    var ideasAccountId = currentIdeasAccountId();
    var ideasSummary = '';
    var messageHub = '';
    if (ideasAccountId) {
      if (state.ideasAccountLoadedFor !== ideasAccountId) loadIdeasData(ideasAccountId);
      if (!state.ideasLoading) {
        var activeIdeasCount = state.ideas.filter(function (i) { return i.status === 'inbox'; }).length;
        var needsReviewCount = state.ideas.filter(function (i) { return i.status === 'inbox' && i.needs_review; }).length;
        var health = pipelineHealthText();
        ideasSummary = (
          '<h3>Idea pipeline</h3>' +
          '<div class="dash-stats" style="margin-bottom:20px">' +
            '<div class="dash-stat"><div class="dash-stat-value">' + activeIdeasCount + '</div><div class="dash-stat-label">Active ideas</div></div>' +
            (needsReviewCount ? '<div class="dash-stat dash-stat-warning"><div class="dash-stat-value">' + needsReviewCount + '</div><div class="dash-stat-label">Needs review</div></div>' : '') +
          '</div>' +
          (health ? '<div class="status-banner" style="margin-top:-10px;margin-bottom:20px">' + esc(health) + '</div>' : '')
        );
      }
      if (state.accountMessagesLoadedFor !== ideasAccountId) loadAccountMessages(ideasAccountId);
      messageHub = accountMessageHubHtml(ideasAccountId);
    }

    return (
      '<div class="dashboard">' +
        '<div class="dash-stats">' + statCards + '</div>' +
        ideasSummary +
        messageHub +
        '<h3>By status</h3><div class="dash-bars">' + statusRows + '</div>' +
        accountRows +
        '<h3>Needs attention</h3>' + attentionRows +
        '<h3>Stuck <span class="text-faint" style="font-weight:400;font-size:12px">(no next action, no activity in ' + STUCK_THRESHOLD_DAYS + '+ days)</span></h3>' + stuckRows +
      '</div>'
    );
  }

  // ==========================================================================
  // RENDER -- top level
  // Rebuilds root.innerHTML from scratch based on current state. Auth comes
  // first: nothing else renders until we know whether someone's logged in
  // and, if so, what role they have. See the module header comment for which
  // interactions call this vs. skip it.
  // ==========================================================================

  function render() {
    var activeId = document.activeElement && document.activeElement.id;
    var selStart, selEnd;
    if (activeId && document.activeElement.setSelectionRange) {
      try { selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } catch (e) {}
    }
    if (!state.authReady) { root.innerHTML = splashHtml(); return; }
    if (!state.authUser || !state.profile) { root.innerHTML = loginScreenHtml(); return; }
    if (state.profile.role === 'client') { root.innerHTML = clientShellHtml(); }
    else if (state.showAdminPanel && state.profile.role === 'admin') { root.innerHTML = adminShellHtml(); }
    else { root.innerHTML = state.creds ? appShellHtml() : connectScreenHtml(); }
    // Rebuilding the whole DOM from a template string on every render (see
    // header comment) means a focused input loses focus and cursor position
    // unless we explicitly restore it -- matters most for anything meant to
    // filter/update live as you type (e.g. the list search box).
    if (activeId) {
      var restored = document.getElementById(activeId);
      if (restored && restored.focus) {
        restored.focus();
        if (selStart !== undefined && restored.setSelectionRange) {
          try { restored.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  function splashHtml() {
    return '<div class="center-loading" style="height:100vh"><div class="spinner"></div></div>';
  }

  // ---- Login screen (everyone starts here) ----------------------------------

  function loginScreenHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--heading)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Sign in</h1>' +
        '<p class="connect-sub">Use the email and password your admin set up for you.</p>' +
        '<form class="connect-form" id="login-form">' +
          '<div><label for="login-email">Email</label>' +
            '<input id="login-email" type="email" autocomplete="username" required value="' + esc(state.loginEmail) + '" /></div>' +
          '<div><label for="login-password">Password</label>' +
            '<input id="login-password" type="password" autocomplete="current-password" required /></div>' +
          (state.loginError ? '<div class="status-banner error">' + esc(state.loginError) + '</div>' : '') +
          '<button class="btn btn-primary" type="submit" style="justify-content:center" ' + (state.loggingIn ? 'disabled' : '') + '>' +
            (state.loggingIn ? 'Signing in…' : 'Sign in') +
          '</button>' +
        '</form>' +
      '</div></div>'
    );
  }

  // ---- Connect screen (admin/rep only -- their own ClickUp OAuth connection) ----

  function connectScreenHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--heading)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Connect your ClickUp account</h1>' +
        '<p class="connect-sub">Connect the ClickUp user or guest account that already has access to the Client Master Content Strategy Workflow list -- ContentFlow reads and writes directly to it using your own ClickUp permissions.</p>' +
        '<form class="connect-form" id="connect-form">' +
          '<label class="remember-row"><input id="cf-remember" type="checkbox" checked /> Remember on this device</label>' +
          (state.connectError ? '<div class="status-banner error">' + esc(state.connectError) + '</div>' : '') +
          '<button class="btn btn-primary" type="submit" style="justify-content:center" ' + (state.connecting ? 'disabled' : '') + '>' +
            (state.connecting ? 'Connecting…' : 'Connect with ClickUp') +
          '</button>' +
        '</form>' +
        '<p class="connect-help">You\'ll be sent to ClickUp to approve access, then brought right back here.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out" style="margin-top:12px">Sign out of ContentFlow</button>' +
      '</div></div>'
    );
  }

  function brandMarkSvg() {
    // aria-hidden: the word "ContentFlow" always sits directly beside this, so
    // the mark is decorative -- announcing it again would just be noise.
    // Keep this path in sync with icons/gen.py, which renders the favicon and
    // home-screen icons from these exact coordinates.
    return '<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 13 L10 7 L14 11 L20 5" stroke="#21160a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  // ---- Main app shell (topnav + view + modal) ---------------------------

  function appShellHtml() {
    var body;
    if (state.loading && !state.listMeta) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading your ClickUp list…</div>';
    } else {
      var view = state.view === 'ideas' ? ideasViewHtml() : state.view === 'board' ? boardHtml() : state.view === 'list' ? listHtml() : state.view === 'dashboard' ? dashboardHtml() : state.view === 'feed' ? feedHtml() : calendarHtml();
      body = (state.error ? '<div class="status-banner error">' + esc(state.error) + '</div>' : '') + view;
    }
    return (
      '<div class="app-shell">' +
        topNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.openTaskId ? taskModalHtml() : '') +
        (state.openIdeaId ? ideaDetailModalHtml() : '') +
        (state.showProfileModal ? profileModalHtml() : '') +
      '</div>'
    );
  }

  /** Sun/moon icon button, shared by both topnavs -- shows the icon for the theme you'd switch TO, matching the common convention (a sun icon in dark mode invites you back to light, and vice versa). */
  /**
   * One consolidated settings menu, shared by both topnavs, replacing what
   * used to be a standalone theme icon + Admin button + Sign out button
   * scattered across the topnav. opts: { isAdmin, showDisconnect, refreshAction }
   * -- refreshAction is 'refresh' (admin/rep) or 'client-refresh' (client);
   * showDisconnect is false for clients, who never connect ClickUp directly.
   */
  function settingsMenuHtml(opts) {
    var isDark = currentTheme() === 'dark';
    var gearIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2"/></svg>';
    return (
      '<div class="settings-menu-wrap">' +
        '<button type="button" class="icon-btn" title="Settings" data-action="toggle-settings-menu">' + gearIcon + '</button>' +
        (state.showSettingsMenu ? (
          '<div class="settings-menu">' +
            '<button type="button" class="settings-menu-item" data-action="toggle-theme">' + (isDark ? 'Switch to light mode' : 'Switch to dark mode') + '</button>' +
            '<button type="button" class="settings-menu-item" data-action="' + opts.refreshAction + '">Sync now</button>' +
            (opts.isAdmin ? '<button type="button" class="settings-menu-item" data-action="open-admin-panel">Admin panel</button>' : '') +
            '<div class="settings-menu-divider"></div>' +
            '<button type="button" class="settings-menu-item" data-action="open-profile-modal">Edit profile</button>' +
            (opts.showDisconnect ? '<button type="button" class="settings-menu-item" data-action="disconnect">Disconnect ClickUp</button>' : '') +
            '<button type="button" class="settings-menu-item" data-action="sign-out">Sign out</button>' +
          '</div>'
        ) : '') +
      '</div>'
    );
  }

  /**
   * Icons + colors for the topnav view tabs. Dashboard and Ideas each get
   * their own color; Board/List/Calendar/Feed intentionally share one
   * color ("workflow views") since they're the same underlying data --
   * just different ways of looking at the same production board -- and
   * should read as a group, not four unrelated destinations.
   */
  var VIEW_TAB_CONFIG = {
    dashboard: { label: 'Dashboard', color: '#3b82f6', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    ideas: { label: 'Ideas', color: '#c9820e', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    board: { label: 'Board', color: '#0f9488', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="5" height="16" rx="1" stroke="currentColor" stroke-width="2"/><rect x="9.5" y="4" width="5" height="10" rx="1" stroke="currentColor" stroke-width="2"/><rect x="16" y="4" width="5" height="13" rx="1" stroke="currentColor" stroke-width="2"/></svg>' },
    list: { label: 'List', color: '#0f9488', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    calendar: { label: 'Calendar', color: '#0f9488', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    feed: { label: 'Feed', color: '#0f9488', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="18" r="1.5" fill="currentColor"/><path d="M5 12a7 7 0 0 1 7 7M5 6a13 13 0 0 1 13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
  };

  function viewTabsHtml(viewKeys) {
    return viewKeys.map(function (v) {
      var cfg = VIEW_TAB_CONFIG[v];
      return (
        '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
          '<span style="color:' + cfg.color + ';display:inline-flex;flex-shrink:0">' + cfg.icon + '</span>' + cfg.label +
        '</button>'
      );
    }).join('');
  }

  function topNavHtml() {
    var accounts = computeAccounts();
    var tabs = viewTabsHtml(['ideas', 'dashboard', 'board', 'list', 'calendar', 'feed']);
    var accountOptions = '<option value="all">All accounts</option>' +
      accounts.map(function (a) { return '<option value="' + esc(a) + '"' + (state.accountFilter === a ? ' selected' : '') + '>' + esc(accountDisplayName(a)) + '</option>'; }).join('');
    var isAdmin = state.profile && state.profile.role === 'admin';

    return (
      '<div class="topnav">' +
        '<div class="brand" data-action="set-view" data-view="dashboard">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          (accounts.length ? '<div class="account-filter"><select id="account-filter-select">' + accountOptions + '</select></div>' : '') +
          '<button type="button" class="btn btn-primary btn-sm" data-action="new-task">+ New</button>' +
          settingsMenuHtml({ isAdmin: isAdmin, showDisconnect: true, refreshAction: 'refresh' }) +
        '</div>' +
      '</div>'
    );
  }

  // ---- Client-role shell (read-only: view + comment, no ClickUp connection) ----
  // Clients never get a ClickUp token -- all data here comes from our own
  // backend (state.clientTasks, loaded via loadClientTasks()/backendFetch()),
  // already filtered server-side to their own account(s). This shell is
  // intentionally separate from appShellHtml()/boardHtml()/etc above rather
  // than reusing them with a bunch of "if not readOnly" branches threaded
  // through drag-and-drop, the task modal, and custom field editing -- for a
  // view-and-comment-only surface, a smaller dedicated set of render
  // functions is easier to keep correct than retrofitting the editable ones.

  function clientTopNavHtml() {
    var tabs = viewTabsHtml(['ideas', 'dashboard', 'board', 'list', 'feed']);
    var accounts = clientAccountOptions();
    var accountOptions = '<option value="all">All my businesses</option>' +
      accounts.map(function (a) { return '<option value="' + esc(a) + '"' + (state.accountFilter === a ? ' selected' : '') + '>' + esc(accountDisplayName(a)) + '</option>'; }).join('');
    return (
      '<div class="topnav">' +
        '<div class="brand" data-action="set-view" data-view="dashboard">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          (accounts.length > 1 ? '<div class="account-filter"><select id="account-filter-select">' + accountOptions + '</select></div>' : '') +
          '<button type="button" class="btn btn-primary btn-sm" data-action="client-new-task">+ New</button>' +
          settingsMenuHtml({ isAdmin: false, showDisconnect: false, refreshAction: 'client-refresh' }) +
        '</div>' +
      '</div>'
    );
  }

  function clientCardHtml(task) {
    var acct = getTaskAccountId(task);
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var chips = mediums.map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('');
    return (
      '<div class="card" data-action="client-open-task" data-task-id="' + esc(task.id) + '">' +
        (acct ? '<div class="account-badge">' + esc(accountDisplayName(acct)) + '</div>' : '') +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
      '</div>'
    );
  }

  function clientDashboardHtml() {
    return dashboardBodyHtml(filteredClientTasks(), 'client-open-task');
  }

  function clientBoardHtml() {
    var tasks = filteredClientTasks();
    var statusesSeen = {};
    var order = [];
    tasks.forEach(function (t) {
      var name = t.status ? t.status.status : '(no status)';
      if (!statusesSeen[name]) { statusesSeen[name] = { color: t.status && t.status.color, tasks: [] }; order.push(name); }
      statusesSeen[name].tasks.push(t);
    });
    if (order.length === 0) {
      return '<div class="empty-state">' + (state.accountFilter && state.accountFilter !== 'all' ? 'No tasks yet for ' + esc(accountDisplayName(state.accountFilter)) + '.' : 'No tasks yet for your account.') + '</div>';
    }
    return '<div class="board">' + order.map(function (name) {
      var col = statusesSeen[name];
      return (
        '<div class="board-column">' +
          '<div class="board-column-header"><span class="status-dot" style="background:' + esc(hexColor(col.color)) + '"></span>' + esc(name) + ' <span class="count">' + col.tasks.length + '</span></div>' +
          '<div class="board-column-body">' + col.tasks.map(clientCardHtml).join('') + '</div>' +
        '</div>'
      );
    }).join('') + '</div>';
  }

  function clientListHtml() {
    var tasks = filteredClientTasks();
    var query = (state.listSearchQuery || '').trim().toLowerCase();
    if (query) tasks = tasks.filter(function (t) { return t.name.toLowerCase().indexOf(query) !== -1; });
    var searchBox = '<input id="list-search-input" type="text" placeholder="Search by name…" value="' + esc(state.listSearchQuery) + '" style="width:100%;max-width:320px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;margin-bottom:12px" />';
    if (tasks.length === 0) {
      var emptyMsg = query
        ? 'No matches for "' + esc(state.listSearchQuery) + '".'
        : (state.accountFilter && state.accountFilter !== 'all' ? 'No tasks yet for ' + esc(accountDisplayName(state.accountFilter)) + '.' : 'No tasks yet for your account.');
      return searchBox + '<div class="empty-state">' + emptyMsg + '</div>';
    }
    return (
      searchBox +
      '<table class="list-table"><thead><tr><th>Name</th><th>Status</th><th>Account</th><th>Mediums</th></tr></thead><tbody>' +
        tasks.map(function (t) {
          var mv = getCustomFieldValue(t, 'Medium(s)');
          var chips = labelsForDropdownField(mv.field, mv.value).map(function (m) {
            return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
          }).join(' ');
          var acct = getTaskAccountId(t);
          return (
            '<tr data-action="client-open-task" data-task-id="' + esc(t.id) + '">' +
              '<td>' + esc(t.name) + '</td>' +
              '<td><span class="status-dot" style="background:' + esc(statusColor(t.status)) + '"></span>' + esc(t.status ? t.status.status : '') + '</td>' +
              '<td>' + (acct ? esc(accountDisplayName(acct)) : '<span class="muted">—</span>') + '</td>' +
              '<td>' + (chips || '<span class="muted">—</span>') + '</td>' +
            '</tr>'
          );
        }).join('') +
      '</tbody></table>'
    );
  }

  /** Read-only task detail + comments panel for a client-role user. */
  function clientTaskPanelHtml() {
    var task = state.clientTasks.filter(function (t) { return t.id === state.clientOpenTaskId; })[0];
    if (!task) return '';
    var accountId = getTaskAccountId(task);
    var filesSection = filesSectionHtml(state.clientTaskFiles, task.id, accountId, 'client', state.clientTaskFilesLoading, state.clientTaskFilesError, state.clientFileUploading);
    var socialChips = socialLinksChipsHtml(activeSocialLinksFor(accountId));
    var socialSection = socialChips ? ('<h3>Social Links</h3><div style="margin-bottom:10px">' + socialChips + '</div>') : '';
    var logHtml = logListHtml(state.clientComments, state.clientCommentsLoading, state.clientLogExpanded, 'toggle-client-log');
    return (
      '<div class="modal-overlay" id="client-modal-overlay">' +
        '<div class="modal-card">' +
          '<div class="modal-header"><h2>' + (accountId ? '<div class="account-badge">' + esc(accountDisplayName(accountId)) + '</div>' : '') + esc(task.name) + '</h2><button type="button" class="icon-btn" data-action="client-close-task">✕</button></div>' +
          '<div class="modal-body">' +
            '<p><strong>Status:</strong> ' + esc(task.status ? task.status.status : '') + '</p>' +
            filesSection +
            socialSection +
            '<h3>Log</h3>' +
            '<div class="comments-list">' + logHtml + '</div>' +
            '<form class="comment-form" id="client-comment-form">' +
              '<textarea id="client-comment-input" placeholder="Log an update…">' + esc(state.clientNewCommentText) + '</textarea>' +
              '<button class="btn btn-primary btn-sm" type="submit" ' + (state.clientPostingComment ? 'disabled' : '') + '>' +
                (state.clientPostingComment ? 'Posting…' : 'Post') +
              '</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function waitingForAccessHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--heading)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Almost there</h1>' +
        '<p class="connect-sub">You\'re signed in, but your admin hasn\'t linked your account to a company yet. Once they do, your content strategy will show up here automatically -- no action needed from you.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out" style="margin-top:12px">Sign out</button>' +
      '</div></div>'
    );
  }

  function clientNewTaskFormHtml() {
    var accounts = clientAccountOptions();
    var accountPicker = accounts.length > 1
      ? '<select id="client-new-task-account" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px">' +
          accounts.map(function (id) { return '<option value="' + esc(id) + '"' + (state.clientNewTaskAccountId === id ? ' selected' : '') + '>' + esc(accountDisplayName(id)) + '</option>'; }).join('') +
        '</select>'
      : '';
    var accountLabel = (accounts.length === 1) ? accountDisplayName(accounts[0]) : null;
    return (
      '<div class="file-category" style="margin-bottom:16px">' +
        '<div class="file-category-header">New entry' + (accountLabel ? ' for ' + esc(accountLabel) : '') + '</div>' +
        '<form id="client-new-task-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
          (accountPicker ? accountPicker : '') +
          '<input id="client-new-task-name" type="text" placeholder="What\'s the idea?" style="flex:1;min-width:180px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px" value="' + esc(state.clientNewTaskName) + '" />' +
          '<button class="btn btn-primary btn-sm" type="submit" ' + (state.clientTaskCreating ? 'disabled' : '') + '>' + (state.clientTaskCreating ? 'Creating…' : 'Create') + '</button>' +
          '<button class="btn btn-outline btn-sm" type="button" data-action="client-cancel-new-task">Cancel</button>' +
        '</form>' +
        (state.clientCreateError ? '<div class="status-banner error" style="margin-top:8px">' + esc(state.clientCreateError) + '</div>' : '') +
      '</div>'
    );
  }

  function clientShellHtml() {
    if (state.accountAccess.length === 0) return waitingForAccessHtml();
    var body;
    if (state.clientLoading && state.clientTasks.length === 0) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading…</div>';
    } else {
      body = (state.clientCreatingTask ? clientNewTaskFormHtml() : '') +
        (state.clientError ? '<div class="status-banner error">' + esc(state.clientError) + '</div>' : '') +
        (state.view === 'ideas' ? ideasViewHtml() : state.view === 'list' ? clientListHtml() : state.view === 'dashboard' ? clientDashboardHtml() : state.view === 'feed' ? clientFeedHtml() : clientBoardHtml());
    }
    return (
      '<div class="app-shell">' +
        clientTopNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.clientOpenTaskId ? clientTaskPanelHtml() : '') +
        (state.openIdeaId ? ideaDetailModalHtml() : '') +
        (state.showProfileModal ? profileModalHtml() : '') +
      '</div>'
    );
  }

  // ---- Admin panel (invite users, see who has access) ------------------------

  function adminAccountsHtml() {
    var ids = Object.keys(state.accountsDirectory || {}).sort(function (a, b) {
      return accountDisplayName(a).localeCompare(accountDisplayName(b));
    });
    if (state.accountSettingsLoading) return '<div class="center-loading"><div class="spinner"></div></div>';
    var searchBox = '<input id="accounts-search-input" type="text" placeholder="Search accounts…" value="' + esc(state.accountsSearchQuery) + '" style="width:100%;max-width:320px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;margin-bottom:14px" />';
    if (ids.length === 0) return searchBox + '<div class="empty-state">No accounts found yet -- they\'ll show up here once ContentFlow can read Companies &amp; Accounts.</div>';
    var query = (state.accountsSearchQuery || '').trim().toLowerCase();
    var filteredIds = query ? ids.filter(function (id) { return accountDisplayName(id).toLowerCase().indexOf(query) !== -1; }) : ids;
    if (filteredIds.length === 0) return searchBox + '<div class="empty-state">No accounts match "' + esc(state.accountsSearchQuery) + '".</div>';

    var rows = filteredIds.map(function (id) {
      var isActive = (state.inactiveAccountIds || []).indexOf(id) === -1;
      var isExpanded = !!state.expandedAccountIds[id];
      var users = state.accountUsersByAccount[id] || [];
      var expandedContent = isExpanded ? (
        '<div style="margin-top:10px">' +
          (users.length
            ? '<div class="pillar-chip-row">' + users.map(function (u) {
                return '<span class="pillar-chip" style="font-weight:400">' + esc(u.email) + ' &middot; ' + esc(u.role) + '</span>';
              }).join('') + '</div>'
            : '<span class="muted" style="font-size:12px">No one invited to this account yet.</span>') +
          '<button type="button" class="btn btn-outline btn-sm" style="margin-top:10px" data-action="invite-to-account" data-account-id="' + esc(id) + '">Invite someone to this account</button>' +
        '</div>'
      ) : '';
      return (
        '<div class="file-category">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
            '<button type="button" data-action="toggle-account-expand" data-account-id="' + esc(id) + '" style="background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;flex:1;min-width:0">' +
              '<span style="font-size:11px;color:var(--text-faint);flex-shrink:0">' + (isExpanded ? '\u25BE' : '\u25B8') + '</span>' +
              '<span class="file-category-header" style="margin-bottom:0">' + esc(accountDisplayName(id)) + (isActive ? '' : ' <span class="text-faint" style="font-weight:400">(inactive)</span>') + ' <span class="count">' + users.length + ' ' + (users.length === 1 ? 'user' : 'users') + '</span></span>' +
            '</button>' +
            '<label class="toggle-switch" title="Active in ContentFlow">' +
              '<input type="checkbox" data-action="toggle-account-active" data-account-id="' + esc(id) + '"' + (isActive ? ' checked' : '') + ' />' +
              '<span class="toggle-slider"></span>' +
            '</label>' +
          '</div>' +
          expandedContent +
        '</div>'
      );
    }).join('');
    return searchBox + '<div class="accounts-list">' + rows + '</div>';
  }

  function adminShellHtml() {
    var rows = state.adminUsers.map(function (u) {
      var accts = u.accounts.map(function (a) { return esc(accountDisplayName(a.clickupAccountId)); }).join(', ');
      return (
        '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.displayName || '') + '</td>' +
          '<td>' + esc(u.role) + '</td><td>' + (accts || '<span class="text-faint">--</span>') + '</td></tr>'
      );
    }).join('');

    var tabs = [
      { key: 'accounts', label: 'Accounts' },
      { key: 'users', label: 'Invite & Users' },
    ].map(function (t) {
      return '<button type="button" class="view-tab' + (state.adminPanelTab === t.key ? ' active' : '') + '" data-action="set-admin-tab" data-value="' + t.key + '">' + t.label + '</button>';
    }).join('');

    var accountsSection = (
      '<h2>Accounts</h2>' +
      '<p class="connect-help" style="margin:-4px 0 12px">Derived from Companies &amp; Accounts. Turn an account off to hide it from selection everywhere in ContentFlow (existing work stays intact -- this only controls visibility going forward).</p>' +
      (state.accountsError ? '<div class="status-banner error">' + esc(state.accountsError) + '</div>' : '') +
      adminAccountsHtml()
    );

    var usersSection = (
      '<h2>Invite someone</h2>' +
      '<form class="connect-form" id="invite-form" style="max-width:420px">' +
        '<div><label for="invite-email">Email</label><input id="invite-email" type="email" required value="' + esc(state.inviteEmail) + '" /></div>' +
        '<div><label for="invite-name">Name (optional)</label><input id="invite-name" type="text" value="' + esc(state.inviteDisplayName) + '" /></div>' +
        '<div><label for="invite-role">Role</label><select id="invite-role">' +
          ['admin', 'rep', 'client'].map(function (r) { return '<option value="' + r + '"' + (state.inviteRole === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label for="invite-accounts">MKC ID(s) from Companies &amp; Accounts, comma-separated</label>' +
          '<input id="invite-accounts" type="text" placeholder="e.g. 86e1q3bwu" value="' + esc(state.inviteAccountIds) + '" /></div>' +
          '<p class="connect-help" style="margin:-6px 0 0">Open the client\'s entry in Companies &amp; Accounts and copy its MKC ID -- it must match the Related Account ID on their tasks exactly.</p>' +
        (state.inviteError ? '<div class="status-banner error">' + esc(state.inviteError) + '</div>' : '') +
        (state.inviteSuccess ? '<div class="status-banner">' + esc(state.inviteSuccess) + '</div>' : '') +
        '<button class="btn btn-primary" type="submit" ' + (state.inviting ? 'disabled' : '') + '>' + (state.inviting ? 'Sending…' : 'Send invite') + '</button>' +
      '</form>' +
      '<h2 style="margin-top:32px">Everyone with access</h2>' +
      (state.adminUsersLoading ? '<div class="center-loading"><div class="spinner"></div></div>' :
        (state.adminUsersError ? '<div class="status-banner error">' + esc(state.adminUsersError) + '</div>' :
          '<div class="table-wrap"><table class="list-table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Accounts</th></tr></thead><tbody>' + rows + '</tbody></table></div>'))
    );

    return (
      '<div class="app-shell">' +
        '<div class="topnav">' +
          '<div class="brand" data-action="close-admin-panel">' + brandMarkSvg() + 'ContentFlow -- Admin</div>' +
          '<div class="view-tabs">' + tabs + '</div>' +
          '<div class="topnav-spacer"></div>' +
          '<div class="topnav-right">' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="close-admin-panel">Back to board</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
          '</div>' +
        '</div>' +
        '<main class="main">' +
          (state.adminPanelTab === 'users' ? usersSection : accountsSection) +
        '</main>' +
      '</div>'
    );
  }

  // ---- Dashboard view (admin/rep) -------------------------------------------

  function dashboardHtml() {
    return dashboardBodyHtml(filteredTasks(), 'open-task');
  }

  // ---- Board (Kanban) view ------------------------------------------------

  function boardHtml() {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    if (!statuses.length) {
      return '<div class="empty-state"><h3>No statuses found</h3><p>This list doesn\'t seem to have any workflow statuses set up in ClickUp yet.</p></div>';
    }
    var tasks = filteredTasks();
    var columns = statuses.map(function (status) {
      var items = tasks.filter(function (t) { return t.status && t.status.status === status.status; });
      var cards = items.map(cardHtml).join('');
      return (
        '<div class="board-column" data-status="' + esc(status.status) + '">' +
          '<div class="board-column-header">' +
            '<span class="status-dot" style="background:' + statusColor(status) + '"></span>' +
            '<span class="board-column-title">' + esc(status.status) + '</span>' +
            '<span class="board-column-count">' + items.length + '</span>' +
          '</div>' +
          cards +
          '<button type="button" class="add-card-btn" data-action="new-task">+ Add task</button>' +
        '</div>'
      );
    }).join('');
    return '<div class="board">' + columns + '</div>';
  }

  function cardHtml(task) {
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var accountId = getTaskAccountId(task);
    var chips = mediums.slice(0, 4).map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('') + (mediums.length > 4 ? '<span class="chip-outline">+' + (mediums.length - 4) + '</span>' : '');
    var avatars = (task.assignees || []).slice(0, 3).map(function (a) {
      return '<span class="avatar" style="background:' + colorForString(a.username || a.email) + '" title="' + esc(a.username) + '">' + esc(initials(a.username || a.email)) + '</span>';
    }).join('');
    return (
      '<div class="card" draggable="true" data-task-id="' + task.id + '" data-action="open-task">' +
        (accountId ? '<div class="account-badge">' + esc(accountDisplayName(accountId)) + '</div>' : '') +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
        (avatars ? '<div class="card-footer"><div class="avatar-stack">' + avatars + '</div></div>' : '') +
      '</div>'
    );
  }

  // ---- List (table) view --------------------------------------------------

  // Column defs for the sortable list view. `get` extracts a comparable
  // string value per task for both display and sorting.
  var LIST_COLUMNS = [
    { key: 'name', label: 'Task', get: function (t) { return t.name || ''; } },
    { key: 'status', label: 'Status', get: function (t) { return (t.status && t.status.status) || ''; } },
    { key: 'account', label: 'Account', get: function (t) { return accountDisplayName(getTaskAccountId(t)); } },
    { key: 'mediums', label: 'Mediums', get: function (t) {
        var mv = getCustomFieldValue(t, 'Medium(s)');
        return labelsForDropdownField(mv.field, mv.value).map(function (m) { return m.label || m.name; }).join(', ');
      } },
    { key: 'scheduled', label: 'Scheduled', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value); } },
    { key: 'published', label: 'Publish date', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value); } },
    { key: 'assignees', label: 'Assignees', get: function (t) { return (t.assignees || []).map(function (a) { return a.username; }).join(', '); } },
  ];

  function listHtml() {
    var tasks = filteredTasks().slice();
    var query = (state.listSearchQuery || '').trim().toLowerCase();
    if (query) tasks = tasks.filter(function (t) { return t.name.toLowerCase().indexOf(query) !== -1; });
    var searchBox = '<input id="list-search-input" type="text" placeholder="Search by name…" value="' + esc(state.listSearchQuery) + '" style="width:100%;max-width:320px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;margin-bottom:12px" />';
    if (!tasks.length) {
      var emptyMsg = query
        ? '<div class="empty-state"><h3>No matches</h3><p>Nothing named like "' + esc(state.listSearchQuery) + '".</p></div>'
        : '<div class="empty-state"><h3>Nothing here yet</h3><p>Content entries will show up here once they\'re added.</p></div>';
      return searchBox + emptyMsg;
    }
    var sortCol = LIST_COLUMNS.filter(function (c) { return c.key === state.listSortKey; })[0] || LIST_COLUMNS[0];
    var dir = state.listSortDir === 'desc' ? -1 : 1;
    tasks.sort(function (a, b) {
      return dir * String(sortCol.get(a)).localeCompare(String(sortCol.get(b)), undefined, { numeric: true });
    });

    var headerCells = LIST_COLUMNS.map(function (c) {
      var arrow = state.listSortKey === c.key ? (state.listSortDir === 'desc' ? ' \u2193' : ' \u2191') : '';
      return '<th data-action="sort-list" data-key="' + c.key + '">' + c.label + arrow + '</th>';
    }).join('');

    var rows = tasks.map(function (task) {
      var mv = getCustomFieldValue(task, 'Medium(s)');
      var mediumLabels = labelsForDropdownField(mv.field, mv.value);
      var mediumsHtml = mediumLabels.map(function (m) {
        return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
      }).join(' ');
      var account = getTaskAccountId(task);
      var scheduled = fromClickUpDate(getCustomFieldValue(task, 'Scheduled Date').value);
      var published = fromClickUpDate(getCustomFieldValue(task, 'Publish Date').value);
      var assignees = (task.assignees || []).map(function (a) { return a.username; }).join(', ');
      return (
        '<tr data-task-id="' + task.id + '" data-action="open-task">' +
          '<td class="task-name-cell">' + esc(task.name) + '</td>' +
          '<td><span class="chip" style="background:' + statusColor(task.status) + '">' + esc(task.status.status) + '</span></td>' +
          '<td>' + (account ? esc(accountDisplayName(account)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (mediumsHtml || '<span class="muted">—</span>') + '</td>' +
          '<td>' + (scheduled ? esc(formatDisplayDate(scheduled)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (published ? esc(formatDisplayDate(published)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (assignees ? esc(assignees) : '<span class="muted">—</span>') + '</td>' +
        '</tr>'
      );
    }).join('');

    return searchBox + '<div class="table-wrap"><table class="list-table"><thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  // Default sort state for the list view (kept outside `state`'s initial
  // literal purely for readability -- functionally identical either way).
  state.listSortKey = 'name';
  state.listSortDir = 'asc';
  state.listSearchQuery = '';

  // ---- Calendar view --------------------------------------------------------

  function calendarHtml() {
    state.calendarCursor = state.calendarCursor || (function () { var d = new Date(); d.setDate(1); return d; })();
    var cursor = state.calendarCursor;
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var itemsByDate = {};
    filteredTasks().forEach(function (t) {
      var publish = fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value);
      var scheduled = fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value);
      var key = publish || scheduled;
      if (!key) return;
      (itemsByDate[key] = itemsByDate[key] || []).push(t);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayKey = localDateKey(new Date());

    var cells = [];
    for (var i = 0; i < startOffset; i++) cells.push({ date: new Date(year, month, 1 - (startOffset - i)), outside: true });
    for (var day = 1; day <= daysInMonth; day++) cells.push({ date: new Date(year, month, day), outside: false });
    while (cells.length % 7 !== 0) {
      var last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), outside: true });
    }

    var dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) { return '<div class="calendar-dow">' + d + '</div>'; }).join('');
    var cellsHtml = cells.map(function (c) {
      var key = localDateKey(c.date);
      var items = itemsByDate[key] || [];
      var shown = items.slice(0, 3).map(function (t) {
        return '<div class="cal-item" style="background:' + statusColor(t.status) + '" data-action="open-task" data-task-id="' + t.id + '" title="' + esc(t.name) + '">' + esc(t.name) + '</div>';
      }).join('');
      var more = items.length > 3 ? '<div class="muted" style="font-size:10.5px">+' + (items.length - 3) + ' more</div>' : '';
      return (
        '<div class="calendar-cell' + (c.outside ? ' outside' : '') + '">' +
          '<div class="calendar-daynum' + (key === todayKey ? ' today' : '') + '">' + c.date.getDate() + '</div>' +
          shown + more +
        '</div>'
      );
    }).join('');

    return (
      '<div class="calendar-header">' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-prev">‹</button>' +
        '<div class="calendar-title">' + cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</div>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-next">›</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-today">Today</button>' +
      '</div>' +
      '<div class="calendar-grid">' + dow + cellsHtml + '</div>'
    );
  }

  // ---- Task modal (create/edit) --------------------------------------------

  /**
   * Build the initial editable "draft" for the task modal, seeded from an
   * existing task (edit mode) or blank defaults (create mode). Kept separate
   * from the raw ClickUp task object so free-typing inputs can mutate it
   * without touching `state.tasks` until Save is actually pressed.
   * @param {object|null} task - null when creating a new task
   */
  function buildTaskDraft(task) {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    var customValues = {};
    state.fields.forEach(function (f) {
      var existing = task ? (task.custom_fields || []).filter(function (cf) { return cf.id === f.id; })[0] : null;
      if (f.type === 'date') customValues[f.id] = fromClickUpDate(existing && existing.value);
      else if (f.type === 'labels') customValues[f.id] = (existing && Array.isArray(existing.value)) ? existing.value.slice() : [];
      else if (f.type === 'drop_down') customValues[f.id] = existing ? existing.value : '';
      else if (f.type === 'checkbox') customValues[f.id] = existing ? (existing.value === 'true' || existing.value === true) : false;
      else customValues[f.id] = existing && existing.value !== undefined && existing.value !== null ? existing.value : '';
    });

    var resolvedAccountId = task ? getTaskAccountId(task) : null;
    var accountTextField = state.fields.filter(function (f) { return f.name === ACCOUNT_FIELD_NAME && (f.type === 'text' || f.type === 'short_text'); })[0];
    if (accountTextField) {
      if (task && resolvedAccountId && !customValues[accountTextField.id]) {
        // The account was only ever set via the relationship field, not the
        // text one -- seed the draft with the resolved value so the modal
        // shows what the card already shows, and so simply saving this task
        // (even without touching the account picker) writes it into the
        // text field too, healing the gap in ClickUp going forward.
        customValues[accountTextField.id] = resolvedAccountId;
      } else if (!task && state.profile && state.profile.role === 'rep') {
        // A rep creating a brand-new task: if they're scoped to exactly one
        // account, prefill it (still read-only in the modal -- only admins
        // can pick a different account) rather than leaving it blank.
        var repAccounts = allowedAccountIds();
        if (repAccounts.length === 1) {
          customValues[accountTextField.id] = repAccounts[0];
          resolvedAccountId = repAccounts[0];
        }
      }
    }

    return {
      id: task ? task.id : 'new',
      name: task ? task.name : '',
      status: task ? task.status.status : (statuses[0] && statuses[0].status),
      originalStatus: task ? task.status.status : null,
      resolvedAccountId: resolvedAccountId,
      notebookUrl: task ? extractNotebookUrl(getCustomFieldValue(task, NOTEBOOK_FIELD_NAME).value) : '', // read-only -- see NOTEBOOK_FIELD_NAME
      assigneeIds: {}, // map of memberId -> true, used as a lightweight Set
      originalAssigneeIds: (task ? task.assignees || [] : []).map(function (a) { return a.id; }),
      customValues: customValues,
    };
  }

  /**
   * Open the task modal for either an existing task or a brand-new one, and
   * (for existing tasks) kick off fetching its comments.
   * @param {object|string} taskOrNew - a ClickUp task object, or the literal string 'new'
   */
  function openTaskModal(taskOrNew) {
    var isNew = taskOrNew === 'new';
    var task = isNew ? null : taskOrNew;
    state.openTaskId = isNew ? 'new' : task.id;
    state.taskDraft = buildTaskDraft(task);
    if (!isNew) {
      (task.assignees || []).forEach(function (a) { state.taskDraft.assigneeIds[a.id] = true; });
    }
    state.comments = [];
    state.commentsLoading = !isNew;
    state.logExpanded = false;
    state.newCommentText = '';
    state.taskFiles = [];
    state.taskFilesError = null;
    state.taskFilesLoading = !isNew;
    render();
    if (!isNew) {
      clickup.getComments(state.creds.token, task.id)
        .then(function (comments) { state.comments = comments; })
        .catch(function () { /* comments are non-critical; fail silently */ })
        .then(function () { state.commentsLoading = false; render(); });
      loadTaskFiles(task.id);
    }
  }

  function closeTaskModal() {
    state.openTaskId = null;
    state.taskDraft = null;
    render();
  }

  /**
   * Renders the Files section: one group per category the caller's role can
   * see, each with its files and (if allowed) an upload control. Shared by
   * taskModalHtml() and clientTaskPanelHtml() -- role decides which
   * categories show and which are uploadable, everything else is identical.
   */
  var LOG_COLLAPSED_COUNT = 4;

  /**
   * Renders a task's Log (ClickUp comments), newest first, with timestamps.
   * Collapsed to LOG_COLLAPSED_COUNT entries by default; toggleAction
   * expands/collapses the rest. Shared by the admin/rep modal and the
   * client panel -- only the toggle's data-action name differs.
   */
  function logListHtml(comments, loading, expanded, toggleAction) {
    if (loading) return '<span class="muted" style="font-size:12.5px">Loading log…</span>';
    if (!comments || comments.length === 0) return '<span class="muted" style="font-size:12.5px">Nothing logged yet.</span>';

    var sorted = comments.slice().sort(function (a, b) { return Number(b.date) - Number(a.date); });
    var visible = expanded ? sorted : sorted.slice(0, LOG_COLLAPSED_COUNT);
    var rows = visible.map(function (c) {
      var uname = (c.user && c.user.username) || 'U';
      var text = c.comment_text || (c.comment && c.comment.map(function (p) { return p.text; }).join('')) || '';
      return (
        '<div class="comment">' +
          '<span class="avatar" style="background:' + colorForString(uname) + ';margin-left:0">' + esc(initials(uname)) + '</span>' +
          '<div class="comment-body">' +
            '<div class="comment-author">' + esc(uname) + ' <span class="comment-time">' + esc(formatLogTimestamp(c.date)) + '</span></div>' +
            '<div>' + esc(text) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    var toggle = sorted.length > LOG_COLLAPSED_COUNT
      ? '<button type="button" class="btn-linklike" data-action="' + toggleAction + '">' + (expanded ? 'Show less' : 'Show all ' + sorted.length + ' entries') + '</button>'
      : '';

    return rows + toggle;
  }

  function filesSectionHtml(files, taskId, accountId, role, loading, errorMsg, uploadingFlag) {
    var visibleCategories = FILE_CATEGORIES.filter(function (c) { return role === 'admin' || role === 'rep' || c.clientVisible; });
    var groups = visibleCategories.map(function (cat) {
      var catFiles = files.filter(function (f) { return f.category === cat.key; });
      var canUpload = role === 'admin' || role === 'rep' || CLIENT_UPLOADABLE_CATEGORIES.indexOf(cat.key) !== -1;
      var isUploadingThis = role === 'client' ? !!uploadingFlag : uploadingFlag === cat.key;
      var fileRows = catFiles.map(function (f) {
        return (
          '<div class="file-row">' +
            '<span class="file-name" data-action="download-file" data-file-id="' + f.id + '">' + esc(f.filename) + '</span>' +
            '<span class="file-meta">' + esc(formatFileSize(f.sizeBytes)) + '</span>' +
            (role !== 'client' ? '<button type="button" class="icon-btn" data-action="delete-file" data-file-id="' + f.id + '" data-task-id="' + esc(taskId) + '" title="Delete">✕</button>' : '') +
          '</div>'
        );
      }).join('');
      return (
        '<div class="file-category">' +
          '<div class="file-category-header">' + esc(cat.label) + (catFiles.length ? ' <span class="count">' + catFiles.length + '</span>' : '') + '</div>' +
          (fileRows || '<div class="muted" style="font-size:12px">No files yet.</div>') +
          (canUpload ? (
            '<label class="upload-btn' + (isUploadingThis ? ' disabled' : '') + '">' + (isUploadingThis ? 'Uploading…' : '+ Upload') +
              '<input type="file" style="display:none" data-action="upload-file" data-category="' + cat.key + '" data-task-id="' + esc(taskId) + '" data-account-id="' + esc(accountId || '') + '" data-role="' + role + '"' + (isUploadingThis ? ' disabled' : '') + ' />' +
            '</label>'
          ) : '') +
        '</div>'
      );
    }).join('');
    return (
      '<div class="files-section"><span class="field-label">Files</span>' +
        (errorMsg ? '<div class="status-banner error" style="margin:8px 0">' + esc(errorMsg) + '</div>' : '') +
        (loading ? '<div class="muted" style="font-size:12.5px;margin-top:8px">Loading files…</div>' : '<div class="file-categories">' + groups + '</div>') +
      '</div>'
    );
  }

  function taskModalHtml() {
    var draft = state.taskDraft;
    var isNew = draft.id === 'new';
    var statuses = (state.listMeta && state.listMeta.statuses) || [];

    var statusOptions = statuses.map(function (s) {
      return '<option value="' + esc(s.status) + '"' + (draft.status === s.status ? ' selected' : '') + '>' + esc(s.status) + '</option>';
    }).join('');

    var assigneePills = state.members.length === 0
      ? '<span class="muted" style="font-size:12.5px">No members found</span>'
      : state.members.map(function (m) {
          var active = !!draft.assigneeIds[m.id];
          return (
            '<button type="button" class="assignee-pill' + (active ? ' active' : '') + '" data-action="toggle-assignee" data-member-id="' + m.id + '">' +
              '<span class="avatar" style="background:' + colorForString(m.username || m.email) + ';width:18px;height:18px;font-size:8.5px;margin-left:0">' + esc(initials(m.username || m.email)) + '</span>' +
              esc(m.username || m.email) +
            '</button>'
          );
        }).join('');

    // The account field gets its own badge/select in the header instead of
    // a regular field row -- pulled out of the generic list here, along
    // with the entry's own "MKC ID" (that one just isn't shown at all --
    // it can stay in ClickUp, unused by this app). There can be TWO fields
    // named "Related Account ID" (a plain text one and a ClickUp
    // relationship/linked-task one, see getTaskAccountId()) -- we can only
    // offer an editable dropdown against the text one, since writing a
    // relationship field needs a different API payload shape.
    var EXCLUDED_FIELD_NAMES = [ACCOUNT_FIELD_NAME, 'MKC ID'];
    var accountTextField = state.fields.filter(function (f) { return f.name === ACCOUNT_FIELD_NAME && (f.type === 'text' || f.type === 'short_text'); })[0];
    var fieldInputs = state.fields.filter(function (f) { return EXCLUDED_FIELD_NAMES.indexOf(f.name) === -1; }).map(renderCustomFieldInput).join('');
    var accountBadgeHtml = '';
    // Only admins may reassign a task's account from the web app -- reps
    // (and anyone else) always see a read-only badge, even when a writable
    // text field exists underneath it.
    if (accountTextField && state.profile.role === 'admin') {
      var accountValue = draft.customValues[accountTextField.id];
      var dirIds = Object.keys(state.accountsDirectory || {}).sort(function (a, b) {
        return state.accountsDirectory[a].localeCompare(state.accountsDirectory[b]);
      });
      var accountOptHtml = dirIds.map(function (id) {
        return '<option value="' + esc(id) + '"' + (String(accountValue) === String(id) ? ' selected' : '') + '>' + esc(state.accountsDirectory[id]) + '</option>';
      }).join('');
      // If the current value isn't in the loaded directory yet (directory
      // still loading, or a stale id), still show it correctly rather than
      // silently falling back to "No account" in the <select>.
      if (accountValue && !(state.accountsDirectory && state.accountsDirectory[String(accountValue)])) {
        accountOptHtml = '<option value="' + esc(accountValue) + '" selected>' + esc(accountDisplayName(accountValue)) + '</option>' + accountOptHtml;
      }
      accountBadgeHtml = (
        '<select class="account-badge-select" id="task-account-select" data-field-id="' + accountTextField.id + '">' +
          '<option value="">No account</option>' + accountOptHtml +
        '</select>'
      );
    } else if (draft.resolvedAccountId) {
      accountBadgeHtml = '<div class="account-badge">' + esc(accountDisplayName(draft.resolvedAccountId)) + '</div>';
    }
    var filesSection = isNew ? '' : filesSectionHtml(state.taskFiles, draft.id, draft.resolvedAccountId, state.profile.role, state.taskFilesLoading, state.taskFilesError, state.taskFileUploading);

    var notebookSection = (isNew || !state.profile || state.profile.role !== 'admin' || !draft.notebookUrl) ? '' : (
      '<div class="files-section"><span class="field-label">Notebook</span>' +
        '<div style="margin-top:8px"><a href="' + esc(draft.notebookUrl) + '" target="_blank" rel="noopener noreferrer" style="word-break:break-all">' + esc(draft.notebookUrl) + '</a></div>' +
        '<p class="connect-help" style="margin:6px 0 0">Set in ClickUp -- not editable here.</p>' +
      '</div>'
    );

    var socialChips = isNew ? '' : socialLinksChipsHtml(activeSocialLinksFor(draft.resolvedAccountId));
    var socialSection = socialChips ? (
      '<div class="files-section"><span class="field-label">Social Links</span><div style="margin-top:8px">' + socialChips + '</div></div>'
    ) : '';

    var commentsSection = isNew ? '' : (
      '<div class="comments-section"><span class="field-label">Log</span><div style="margin-top:10px">' +
        logListHtml(state.comments, state.commentsLoading, state.logExpanded, 'toggle-log') +
      '</div>' +
      '<form class="comment-form" id="comment-form">' +
        '<textarea id="new-comment-input" placeholder="Log an update…">' + esc(state.newCommentText) + '</textarea>' +
        '<button class="btn btn-outline btn-sm" type="submit">Post</button>' +
      '</form></div>'
    );

    return (
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal">' +
