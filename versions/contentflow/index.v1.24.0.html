  /**
   * Render one custom field's input inside the task modal, dispatching on
   * the field's ClickUp type. Falls back to a plain text input for any type
   * not explicitly handled (url, email, short_text, currency, etc.) so new
   * fields added in ClickUp later still show up without a code change.
   * @param {object} field - a custom field definition from GET /list/{id}/field
   */
  function renderCustomFieldInput(field) {
    var value = state.taskDraft.customValues[field.id];
    var label = '<span class="field-label">' + esc(field.name) + '</span>';

    if (field.type === 'date') {
      return '<div class="field-group">' + label + '<input class="field-input" type="date" data-field-id="' + field.id + '" data-field-kind="date" value="' + esc(value || '') + '" /></div>';
    }
    if (field.type === 'labels') {
      var options = (field.type_config && field.type_config.options) || [];
      var toggles = options.map(function (opt) {
        var active = (value || []).indexOf(opt.id) !== -1;
        var color = hexColor(opt.color);
        var style = active
          ? 'background:' + color + ';border-color:' + color + ';color:#fff'
          : 'border-color:' + color + ';color:' + color;
        return '<button type="button" class="medium-toggle' + (active ? ' active' : '') + '" style="' + style + '" data-action="toggle-label" data-field-id="' + field.id + '" data-option-id="' + opt.id + '">' + esc(opt.label) + '</button>';
      }).join('');
      return '<div class="field-group full">' + label + '<div class="medium-toggle-group">' + toggles + '</div></div>';
    }
    if (field.type === 'drop_down') {
      var ddOptions = (field.type_config && field.type_config.options) || [];
      var opts = '<option value="">—</option>' + ddOptions.map(function (o) {
        return '<option value="' + o.orderindex + '"' + (String(value) === String(o.orderindex) ? ' selected' : '') + '>' + esc(o.name) + '</option>';
      }).join('');
      return '<div class="field-group">' + label + '<select class="field-select" data-field-id="' + field.id + '" data-field-kind="drop_down">' + opts + '</select></div>';
    }
    if (field.type === 'checkbox') {
      return '<div class="field-group">' + label + '<label class="remember-row" style="margin-top:4px"><input type="checkbox" data-field-id="' + field.id + '" data-field-kind="checkbox" ' + (value ? 'checked' : '') + ' /> Yes</label></div>';
    }
    if (field.type === 'number') {
      return '<div class="field-group">' + label + '<input class="field-input" type="number" data-field-id="' + field.id + '" data-field-kind="number" value="' + esc(value) + '" /></div>';
    }
    // Fallback: plain text (covers "text", "short_text", "url", "email", and anything unrecognized).
    return '<div class="field-group">' + label + '<input class="field-input" type="text" data-field-id="' + field.id + '" data-field-kind="text" value="' + esc(value) + '" /></div>';
  }

  // ==========================================================================
  // SAVE / DELETE / COMMENT ACTIONS
  // ==========================================================================

  /**
   * Persist the task modal's current draft to ClickUp: creates or updates the
   * task itself (name/status/assignees), then writes each custom field
   * individually. Field-level failures are logged but don't block the overall
   * save, since one bad field shouldn't lose the rest of the user's edits.
   */
  function handleSaveTask() {
    var draft = state.taskDraft;
    if (!draft.name || !draft.name.trim()) {
      state.error = 'Give this task a name first.';
      render();
      return;
    }
    var enteringGatedStatus = draft.status === GATED_STATUS_NAME && draft.originalStatus !== GATED_STATUS_NAME;
    if (enteringGatedStatus && !hasReviewReadyFiles(state.taskFiles) && !window.confirm('This task has no draft or media files yet. Move to "For Review" anyway?')) {
      return;
    }
    state.saving = true;
    state.error = null;
    render();

    var token = state.creds.token, listId = state.creds.listId;
    var assigneeIds = Object.keys(draft.assigneeIds).filter(function (id) { return draft.assigneeIds[id]; });

    var taskPromise;
    if (draft.id === 'new') {
      taskPromise = clickup.createTask(token, listId, { name: draft.name.trim(), status: draft.status, assignees: assigneeIds })
        .then(function (created) { return created.id; });
    } else {
      var toAdd = assigneeIds.filter(function (id) { return draft.originalAssigneeIds.indexOf(id) === -1; });
      var toRemove = draft.originalAssigneeIds.filter(function (id) { return assigneeIds.indexOf(id) === -1; });
      taskPromise = clickup.updateTask(token, draft.id, {
        name: draft.name.trim(),
        status: draft.status,
        assignees: { add: toAdd, rem: toRemove },
      }).then(function () { return draft.id; });
    }

    taskPromise
      .then(function (taskId) {
        // Push each custom field's value one call at a time. ClickUp has no
        // bulk custom-field-update endpoint, so this is N+1 requests -- fine
        // at this list's expected scale (a handful of fields per task).
        var chain = Promise.resolve();
        state.fields.forEach(function (f) {
          // Never touch the entry's own MKC ID (unused by this app), and
          // never write to a relationship-typed "Related Account ID" field
          // -- ClickUp relationship fields need a different payload shape
          // ({add:[...], rem:[...]}), not a plain value, and this app only
          // ever intends to manage the text-typed sibling field.
          if (f.name === 'MKC ID') return;
          if (f.name === ACCOUNT_FIELD_NAME && f.type !== 'text' && f.type !== 'short_text') return;
          chain = chain.then(function () {
            var val = draft.customValues[f.id];
            var payload = val;
            if (f.type === 'date') {
              payload = toClickUpDate(val);
              if (payload === null && !val) return; // nothing to set, skip the call entirely
            }
            if (f.type === 'checkbox') payload = val ? 'true' : 'false';
            if (f.type === 'drop_down' && val !== '') payload = Number(val);
            return clickup.setCustomField(token, taskId, f.id, payload)
              .catch(function (err) { console.warn('Field update failed:', f.name, err.message); });
          });
        });
        return chain;
      })
      .then(function () {
        // Reset BEFORE closing the modal: state.saving is a single shared flag
        // (not per-modal-instance), so leaving it true here would carry over
        // and permanently disable the Save button the next time any task
        // modal opens. (Caught by the automated smoke test -- see git log.)
        state.saving = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.saving = false;
        state.error = err.message || 'Could not save this task.';
        render();
      });
  }

  function handleDeleteTask() {
    if (!window.confirm('Delete this task from ClickUp? This can\u2019t be undone.')) return;
    state.deleting = true;
    render();
    clickup.deleteTask(state.creds.token, state.taskDraft.id)
      .then(function () {
        // Same "reset the shared flag on the success path too" fix as
        // handleSaveTask above -- see that comment for why this matters.
        state.deleting = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.deleting = false;
        state.error = err.message;
        render();
      });
  }

  function submitComment() {
    var text = (state.newCommentText || '').trim();
    if (!text || state.taskDraft.id === 'new') return;
    state.newCommentText = '';
    clickup.postComment(state.creds.token, state.taskDraft.id, text)
      .then(function () { return clickup.getComments(state.creds.token, state.taskDraft.id); })
      .then(function (comments) { state.comments = comments; render(); })
      .catch(function (err) { state.error = err.message; render(); });
  }

  // ==========================================================================
  // EVENT DELEGATION
  // All listeners are attached ONCE, directly on `root`, and dispatch based on
  // `data-action` / element id, since root.innerHTML is fully replaced on
  // every render() (so per-element listeners would be lost anyway).
  // ==========================================================================

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'connect-form') {
      var remember = document.getElementById('cf-remember').checked;
      startClickUpOAuth(CU_LIST_ID, remember); // navigates away to ClickUp -- no render() needed here
    } else if (e.target.id === 'comment-form') {
      submitComment(); // RENDER (via submitComment -> render()) -- fine, this is a discrete submit, not a keystroke
    } else if (e.target.id === 'login-form') {
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      if (email && password) handleLogin(email, password);
    } else if (e.target.id === 'invite-form') {
      submitInvite(); // reads current state.invite* fields, already kept in sync by the input/change handlers below
    } else if (e.target.id === 'client-comment-form') {
      submitClientComment();
    } else if (e.target.id === 'client-new-task-form') {
      submitClientNewTask();
    } else if (e.target.id === 'new-pillar-form') {
      submitNewPillar(e.target.getAttribute('data-account-id'));
    } else if (e.target.id === 'new-idea-form') {
      submitNewIdea(e.target.getAttribute('data-account-id'));
    } else if (e.target.id === 'account-message-form') {
      submitAccountMessage(e.target.getAttribute('data-account-id'));
    }
  });

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (state.showSettingsMenu && !e.target.closest('.settings-menu-wrap')) {
      state.showSettingsMenu = false;
      if (!el) { render(); return; } // nothing else to do -- just close it
      // else fall through: the action's own render() below will naturally reflect the now-closed menu too
    }
    if (!el) return;
    var action = el.getAttribute('data-action');

    switch (action) {
      case 'set-view':
        state.view = el.getAttribute('data-view');
        render(); // RENDER: structural view switch
        break;
      case 'refresh':
        loadAll(); // RENDER: loadAll() re-renders when the fetch settles
        break;
      case 'disconnect':
        state.showSettingsMenu = false;
        disconnect(); // RENDER
        break;
      case 'toggle-settings-menu':
        state.showSettingsMenu = !state.showSettingsMenu;
        render();
        break;
      case 'toggle-theme':
        toggleTheme(); // RENDER (inside)
        break;
      case 'open-profile-modal':
        openProfileModal(); // RENDER (inside)
        break;
      case 'close-profile-modal':
        closeProfileModal(); // RENDER (inside)
        break;
      case 'save-profile-name':
        saveProfileDisplayName(); // RENDER (inside)
        break;
      case 'save-profile-email':
        saveProfileEmail(); // RENDER (inside)
        break;
      case 'save-profile-password':
        saveProfilePassword(); // RENDER (inside)
        break;
      case 'sign-out':
        handleLogout(); // RENDER (async, once signOut()/disconnect() resolve)
        break;
      case 'open-admin-panel':
        state.showAdminPanel = true;
        render();
        loadAdminUsers();
        loadAccountSettings();
        loadAccountsDirectory().then(render); // guarantees the Accounts screen always has fresh account names, regardless of when loadAll() last ran
        break;
      case 'close-admin-panel':
        state.showAdminPanel = false;
        render();
        break;
      case 'invite-to-account':
        state.inviteAccountIds = el.getAttribute('data-account-id');
        state.inviteError = null;
        state.inviteSuccess = null;
        state.adminPanelTab = 'users'; // jump to the tab where the (now pre-filled) invite form actually lives
        render();
        break;
      case 'set-admin-tab':
        state.adminPanelTab = el.getAttribute('data-value');
        render();
        break;
      case 'toggle-account-expand': {
        var expandId = el.getAttribute('data-account-id');
        state.expandedAccountIds[expandId] = !state.expandedAccountIds[expandId];
        render();
        break;
      }
      case 'client-refresh':
        loadClientTasks(); // RENDER (inside loadClientTasks)
        break;
      case 'client-new-task': {
        state.clientCreatingTask = true;
        state.clientCreateError = null;
        var newTaskAccounts = clientAccountOptions();
        state.clientNewTaskAccountId = (state.accountFilter && state.accountFilter !== 'all') ? state.accountFilter : (newTaskAccounts[0] || null);
        render();
        break;
      }
      case 'client-cancel-new-task':
        state.clientCreatingTask = false;
        state.clientNewTaskName = '';
        state.clientCreateError = null;
        render();
        break;
      case 'client-open-task': {
        var clientTaskId = el.getAttribute('data-task-id');
        openClientTask(clientTaskId); // RENDER (inside openClientTask)
        break;
      }
      case 'client-close-task':
        closeClientTask(); // RENDER
        break;
      case 'download-file':
        downloadFile(el.getAttribute('data-file-id')); // no RENDER -- opens a new tab, doesn't change this page's state
        break;
      case 'delete-file':
        if (window.confirm('Delete this file? This cannot be undone.')) {
          deleteFile(el.getAttribute('data-file-id'), el.getAttribute('data-task-id')); // RENDER (inside deleteFile/loadTaskFiles)
        }
        break;
      case 'toggle-log':
        state.logExpanded = !state.logExpanded;
        render();
        break;
      case 'toggle-client-log':
        state.clientLogExpanded = !state.clientLogExpanded;
        render();
        break;
      case 'start-rhythm-setup':
        enterRhythmSetup(); // RENDER (inside)
        break;
      case 'open-foundation':
        state.showFoundation = true;
        state.foundationEditing = false;
        render();
        break;
      case 'close-foundation':
        state.showFoundation = false;
        state.foundationEditing = false;
        render();
        break;
      case 'ideas-subnav-goto': {
        var subnavDest = el.getAttribute('data-value');
        if (subnavDest === 'rhythm') {
          state.showFoundation = false;
          enterRhythmSetup(); // RENDER (inside)
        } else if (subnavDest === 'foundation') {
          state.showRhythmSetup = false;
          state.showFoundation = true;
          state.foundationEditing = false;
          render();
        } else {
          state.showRhythmSetup = false;
          state.showFoundation = false;
          state.foundationEditing = false;
          render();
        }
        break;
      }
      case 'start-edit-foundation':
        startEditFoundation(); // RENDER (inside)
        break;
      case 'start-new-foundation':
        startNewFoundation(); // RENDER (inside)
        break;
      case 'set-active-foundation':
        setActiveFoundation(el.getAttribute('data-id'), el.getAttribute('data-account-id')); // RENDER (inside)
        break;
      case 'delete-foundation':
        deleteFoundation(el.getAttribute('data-id'), el.getAttribute('data-account-id')); // RENDER (inside, after confirm)
        break;
      case 'duplicate-foundation':
        duplicateFoundation(); // RENDER (inside)
        break;
      case 'cancel-edit-foundation':
        cancelEditFoundation(); // RENDER (inside)
        break;
      case 'save-foundation':
        saveFoundation(el.getAttribute('data-account-id')); // RENDER (inside)
        break;
      case 'start-new-prompt':
        startNewPrompt(); // RENDER (inside)
        break;
      case 'start-edit-prompt':
        startEditPrompt(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'cancel-prompt-form':
        cancelPromptForm(); // RENDER (inside)
        break;
      case 'save-prompt':
        savePrompt(el.getAttribute('data-foundation-id'), el.getAttribute('data-account-id')); // RENDER (inside)
        break;
      case 'delete-prompt':
        deletePrompt(el.getAttribute('data-id')); // RENDER (inside, after confirm)
        break;
      case 'toggle-prompt-expanded':
        togglePromptExpanded(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'add-audience-bucket':
        addAudienceBucket(); // RENDER (inside)
        break;
      case 'remove-audience-bucket':
        removeAudienceBucket(Number(el.getAttribute('data-index'))); // RENDER (inside)
        break;
      case 'add-offer':
        addOffer(); // RENDER (inside)
        break;
      case 'remove-offer':
        removeOffer(Number(el.getAttribute('data-index'))); // RENDER (inside)
        break;
      case 'copy-foundation-text': {
        var textToCopy = el.getAttribute('data-copy-text');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).catch(function () {});
        }
        break; // no state change -- nothing to re-render
      }
      case 'finish-rhythm-setup':
        submitRhythm(el.getAttribute('data-account-id')); // RENDER (inside, once the save resolves)
        break;
      case 'set-rhythm-draft': {
        var rField = el.getAttribute('data-field');
        var rValue = el.getAttribute('data-value');
        if (rField === 'naturalSource') state.rhythmDraftSource = rValue;
        else if (rField === 'weeklyCapacity') state.rhythmDraftCapacity = rValue;
        else if (rField === 'routineType') state.rhythmDraftRoutine = rValue;
        render();
        break;
      }
      case 'delete-pillar':
        deletePillar(el.getAttribute('data-id')); // RENDER (inside, after confirm)
        break;
      case 'start-new-idea':
        state.ideaCapturing = true;
        render();
        break;
      case 'cancel-new-idea':
        state.ideaCapturing = false;
        state.ideaDraftTitle = '';
        state.ideaDraftBody = '';
        render();
        break;
      case 'convert-idea': {
        var ideaToConvert = state.ideas.filter(function (i) { return i.id === el.getAttribute('data-id'); })[0];
        if (ideaToConvert) convertIdea(ideaToConvert); // RENDER (inside)
        break;
      }
      case 'archive-idea':
        archiveIdea(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'unarchive-idea':
        unarchiveIdea(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'set-idea-type':
        state.ideaDraftSourceType = el.getAttribute('data-value');
        render();
        break;
      case 'set-idea-filter':
        state.ideaFilter = el.getAttribute('data-value');
        render();
        break;
      case 'toggle-idea-sort':
        state.ideaSort = state.ideaSort === 'oldest' ? 'newest' : 'oldest';
        render();
        break;
      case 'open-idea-detail':
        openIdeaDetail(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'close-idea-detail':
        closeIdeaDetail(); // RENDER (inside)
        break;
      case 'start-idea-edit': {
        var ideaToEdit = state.ideas.filter(function (i) { return i.id === el.getAttribute('data-id'); })[0];
        if (ideaToEdit) startEditIdea(ideaToEdit); // RENDER (inside)
        break;
      }
      case 'save-idea-edit':
        saveIdeaEdit(el.getAttribute('data-id')); // RENDER (inside)
        break;
      case 'cancel-idea-edit':
        cancelEditIdea(); // RENDER (inside)
        break;
      case 'delete-idea-file':
        deleteIdeaAttachment(el.getAttribute('data-file-id'), el.getAttribute('data-idea-id')); // RENDER (inside, after confirm)
        break;
      case 'new-task':
        openTaskModal('new'); // RENDER
        break;
      case 'open-task': {
        var taskId = el.getAttribute('data-task-id');
        var task = state.tasks.filter(function (t) { return t.id === taskId; })[0];
        if (task) openTaskModal(task); // RENDER
        break;
      }
      case 'close-modal':
        closeTaskModal(); // RENDER
        break;
      case 'toggle-assignee': {
        var mid = el.getAttribute('data-member-id');
        state.taskDraft.assigneeIds[mid] = !state.taskDraft.assigneeIds[mid];
        render(); // RENDER: a button toggle, not a text cursor -- safe to re-render
        break;
      }
      case 'toggle-label': {
        var fid = el.getAttribute('data-field-id');
        var oid = el.getAttribute('data-option-id');
        var arr = state.taskDraft.customValues[fid] || [];
        var idx = arr.indexOf(oid);
        if (idx === -1) arr.push(oid); else arr.splice(idx, 1);
        state.taskDraft.customValues[fid] = arr;
        render(); // RENDER
        break;
      }
      case 'save-task':
        handleSaveTask();
        break;
      case 'delete-task':
        handleDeleteTask();
        break;
      case 'cal-prev':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() - 1, 1);
        render();
        break;
      case 'cal-next':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() + 1, 1);
        render();
        break;
      case 'cal-today':
        state.calendarCursor = (function () { var d = new Date(); d.setDate(1); return d; })();
        render();
        break;
      case 'sort-list': {
        var key = el.getAttribute('data-key');
        if (state.listSortKey === key) state.listSortDir = state.listSortDir === 'asc' ? 'desc' : 'asc';
        else { state.listSortKey = key; state.listSortDir = 'asc'; }
        render();
        break;
      }
    }

    // Clicking the dark overlay itself (not its modal-card children) closes the modal.
    if (e.target.id === 'modal-overlay') closeTaskModal();
    if (e.target.id === 'client-modal-overlay') closeClientTask();
    if (e.target.id === 'idea-detail-overlay') closeIdeaDetail();
    if (e.target.id === 'profile-modal-overlay') closeProfileModal();
  });

  root.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-action') === 'upload-file') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var category = e.target.getAttribute('data-category');
      var taskId = e.target.getAttribute('data-task-id');
      var accountId = e.target.getAttribute('data-account-id');
      var role = e.target.getAttribute('data-role');
      uploadFile(file, taskId, accountId, category, role === 'client'); // RENDER (inside uploadFile)
      return;
    }
    if (e.target.getAttribute('data-action') === 'upload-idea-file') {
      var ideaFile = e.target.files && e.target.files[0];
      if (!ideaFile) return;
      var ideaForUpload = state.ideas.filter(function (i) { return i.id === e.target.getAttribute('data-idea-id'); })[0];
      if (ideaForUpload) uploadIdeaAttachment(ideaFile, ideaForUpload); // RENDER (inside)
      return;
    }
    if (e.target.id === 'account-filter-select') {
      state.accountFilter = e.target.value;
      render(); // RENDER: structural (changes which tasks are shown everywhere, including the Idea Inbox's scope)
      return;
    }
    if (e.target.id === 'foundation-switcher-select') {
      switchFoundation(e.target.value); // RENDER (inside)
      return;
    }
    if (e.target.id === 'client-new-task-account') {
      state.clientNewTaskAccountId = e.target.value;
      render();
      return;
    }
    if (e.target.id === 'idea-pillar-select') {
      state.ideaDraftPillarId = e.target.value;
      return;
    }
    if (e.target.id === 'idea-private-checkbox') {
      state.ideaDraftIsPrivate = e.target.checked;
      return;
    }
    if (e.target.id === 'idea-edit-pillar') {
      state.ideaEditPillarId = e.target.value;
      return;
    }
    if (e.target.id === 'task-status-select') {
      // NO-RENDER: captured into the draft for use at Save time; the visual
      // board grouping only needs to update after Save, not while editing.
      state.taskDraft.status = e.target.value;
      return;
    }
    if (e.target.id === 'invite-role') {
      // NO-RENDER: the account-id field's requiredness only actually matters
      // at submit time (see submitInvite()), so no need to re-render here.
      state.inviteRole = e.target.value;
      return;
    }
    if (e.target.getAttribute('data-action') === 'toggle-account-active') {
      setAccountActive(e.target.getAttribute('data-account-id'), e.target.checked); // RENDER (inside, once the save resolves)
      return;
    }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      // NO-RENDER: custom field dropdown/checkbox/date changes just update
      // the draft; see the 'input' handler below for the text/number/date
      // typing case (dates fire 'change', not 'input', in most browsers,
      // which is why date is handled in both places defensively).
      var kind = e.target.getAttribute('data-field-kind');
      if (kind === 'checkbox') state.taskDraft.customValues[fieldId] = e.target.checked;
      else state.taskDraft.customValues[fieldId] = e.target.value;
    }
  });

  root.addEventListener('input', function (e) {
    // Exception to the NO-RENDER convention below: this one needs to filter
    // the list live as you type, which render() can now do safely since it
    // restores focus/cursor position afterward (see render()).
    if (e.target.id === 'list-search-input') {
      state.listSearchQuery = e.target.value;
      render();
      return;
    }
    if (e.target.id === 'accounts-search-input') {
      state.accountsSearchQuery = e.target.value;
      render();
      return;
    }
    // NO-RENDER handlers: every case here only writes into `state`, never
    // calls render(), so the browser's native text-cursor position is
    // preserved while the user is actively typing.
    if (e.target.id === 'task-name-input') {
      state.taskDraft.name = e.target.value;
      return;
    }
    if (e.target.id === 'new-comment-input') {
      state.newCommentText = e.target.value;
      return;
    }
    if (e.target.id === 'account-message-input') {
      state.newAccountMessageText = e.target.value;
      return;
    }
    if (e.target.id === 'profile-name-input') { state.profileEditDisplayName = e.target.value; return; }
    if (e.target.id === 'profile-email-input') { state.profileEditEmail = e.target.value; return; }
    if (e.target.id === 'profile-new-password-input') { state.profileNewPassword = e.target.value; return; }
    if (e.target.id === 'profile-confirm-password-input') { state.profileConfirmPassword = e.target.value; return; }
    var fdArrayName = e.target.getAttribute('data-fd-array');
    if (fdArrayName) {
      var fdIndex = Number(e.target.getAttribute('data-index'));
      var fdField = e.target.getAttribute('data-field');
      var fdArr = fdArrayName === 'bucket' ? state.fdAudienceBuckets : state.fdOffers;
      if (fdArr[fdIndex]) fdArr[fdIndex][fdField] = e.target.value;
      return;
    }
    if (e.target.id === 'fd-name') { state.fdName = e.target.value; return; }
    if (e.target.id === 'fd-niche') { state.fdNiche = e.target.value; return; }
    if (e.target.id === 'fd-business-description') { state.fdBusinessDescription = e.target.value; return; }
    if (e.target.id === 'fd-elevator-pitch') { state.fdElevatorPitch = e.target.value; return; }
    if (e.target.id === 'fd-value-proposition') { state.fdValueProposition = e.target.value; return; }
    if (e.target.id === 'fd-expertise-areas') { state.fdExpertiseAreas = e.target.value; return; }
    if (e.target.id === 'fd-proof-points') { state.fdProofPoints = e.target.value; return; }
    if (e.target.id === 'fd-voice-adjectives') { state.fdVoiceAdjectives = e.target.value; return; }
    if (e.target.id === 'fd-voice-avoid') { state.fdVoiceAvoid = e.target.value; return; }
    if (e.target.id === 'fd-keywords') { state.fdKeywords = e.target.value; return; }
    if (e.target.id === 'fd-cta-lines') { state.fdCtaLines = e.target.value; return; }
    if (e.target.id === 'fd-hook-lines') { state.fdHookLines = e.target.value; return; }
    if (e.target.id === 'fd-notebook-url') { state.fdNotebookUrl = e.target.value; return; }
    if (e.target.id.indexOf('fd-social-') === 0) {
      var socialKey = e.target.id.slice('fd-social-'.length);
      var socialNetwork = SOCIAL_NETWORKS.filter(function (n) { return n.key === socialKey; })[0];
      state.fdSocialLinks[socialKey] = (socialNetwork && socialNetwork.isFullUrl) ? e.target.value.trim() : sanitizeSocialUsername(e.target.value);
      return;
    }
    if (e.target.id === 'pd-name') { state.pdName = e.target.value; return; }
    if (e.target.id === 'pd-prompt-text') { state.pdPromptText = e.target.value; return; }
    if (e.target.id === 'pd-notes') { state.pdNotes = e.target.value; return; }
    if (e.target.id === 'login-email') { state.loginEmail = e.target.value; return; }
    if (e.target.id === 'login-password') { state.loginPassword = e.target.value; return; }
    if (e.target.id === 'invite-email') { state.inviteEmail = e.target.value; return; }
    if (e.target.id === 'invite-name') { state.inviteDisplayName = e.target.value; return; }
    if (e.target.id === 'invite-accounts') { state.inviteAccountIds = e.target.value; return; }
    if (e.target.id === 'client-comment-input') { state.clientNewCommentText = e.target.value; return; }
    if (e.target.id === 'client-new-task-name') { state.clientNewTaskName = e.target.value; return; }
    if (e.target.id === 'new-pillar-input') { state.newPillarName = e.target.value; return; }
    if (e.target.id === 'idea-title-input') { state.ideaDraftTitle = e.target.value; return; }
    if (e.target.id === 'idea-body-input') { state.ideaDraftBody = e.target.value; return; }
    if (e.target.id === 'idea-url-input') { state.ideaDraftSourceUrl = e.target.value; return; }
    if (e.target.id === 'idea-category-input') { state.ideaDraftCategory = e.target.value; return; }
    if (e.target.id === 'idea-edit-title') { state.ideaEditTitle = e.target.value; return; }
    if (e.target.id === 'idea-edit-url') { state.ideaEditUrl = e.target.value; return; }
    if (e.target.id === 'idea-edit-body') { state.ideaEditBody = e.target.value; return; }
    if (e.target.id === 'idea-edit-category') { state.ideaEditCategory = e.target.value; return; }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      var kind = e.target.getAttribute('data-field-kind');
      state.taskDraft.customValues[fieldId] = kind === 'number' ? e.target.value : e.target.value;
    }
  });

  // ---- Drag-and-drop (board columns) ---------------------------------------
  // dragover/drop bubble normally, so plain delegation on `root` works here
  // too, using closest('.board-column') to find the drop target regardless
  // of which child element the pointer is actually over.

  root.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('.card[draggable]');
    if (card) { e.dataTransfer.setData('text/task-id', card.getAttribute('data-task-id')); return; }
    var ideaCard = e.target.closest && e.target.closest('.idea-card[draggable]');
    if (ideaCard) { e.dataTransfer.setData('text/idea-id', ideaCard.getAttribute('data-idea-id')); }
  });

  root.addEventListener('dragover', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) { e.preventDefault(); col.classList.add('drag-over'); }
  });

  root.addEventListener('dragleave', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) col.classList.remove('drag-over');
  });

  root.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    var taskId = e.dataTransfer.getData('text/task-id');
    if (taskId) {
      var statusName = col.getAttribute('data-status');
      if (statusName) moveTask(taskId, statusName); // RENDER (inside moveTask)
      return;
    }
    var ideaId = e.dataTransfer.getData('text/idea-id');
    if (ideaId && col.classList.contains('pillar-column')) {
      moveIdeaToPillar(ideaId, col.getAttribute('data-pillar-id') || null); // RENDER (inside)
    }
  });

  // ==========================================================================
  // THEME (dark/light)
  // Stored in localStorage as 'contentflow.theme' ('light' | 'dark'); if
  // unset, the CSS's own @media (prefers-color-scheme) block handles the
  // OS-level default, and document.documentElement gets no explicit
  // data-theme attribute at all until the person picks one deliberately.
  // ==========================================================================
  var THEME_STORAGE_KEY = 'contentflow.theme';

  function applyTheme(theme) {
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme'); // let prefers-color-scheme decide
    }
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_STORAGE_KEY); } catch (e) {}
    applyTheme(saved);
  }

  function currentTheme() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function toggleTheme() {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_STORAGE_KEY, next); } catch (e) {}
    render(); // re-render so the toggle's own icon/label reflects the new state
  }

  // ==========================================================================
  // BOOT
  // Cached ClickUp creds (if any) are loaded immediately so they're ready the
  // moment an admin/rep's profile comes back, but nothing actually renders
  // until initAuth() confirms whether anyone's logged in -- see render()'s
  // authReady gate above.
  // ==========================================================================
  initTheme();
  state.creds = loadCreds();
  render(); // shows the splash screen while initAuth() resolves
  initAuth();

</script>
</body>
</html>
